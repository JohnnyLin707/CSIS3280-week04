<!doctype html>
<html>
<head>
    <title>Checkboxes array</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container">
<h1>Extra pizza toppings</h1>

<!--
  重點：用 name="toppings[]" 讓「多個核取方塊」組成一個陣列
  - method="GET" → 送出後資料會出現在網址列，例如：
        04_checkboxes_process.php?toppings[]=olives&toppings[]=garlic
  - PHP 端收到的是一個陣列 $_GET['toppings']，例如：
        ['olives', 'garlic']
    可用 foreach ($_GET['toppings'] as $topping) 逐一處理，
    或用 in_array('olives', $_GET['toppings']) 檢查某項是否被勾選。

  注意：勾選方塊「沒勾就不送出」，所以若使用者什麼都沒勾，
  $_GET['toppings'] 這個鍵根本不存在，PHP 端要先用 isset() / ?? [] 處理。
-->
<form method="GET" action="04_checkboxes_process.php">

    <!-- 把 input 包在 <label> 裡面：點文字也能勾選，不需要 for / id 對應 -->
    <p><label>
        <input type="checkbox" name="toppings[]" value="olives"> Olives
    </label></p>

    <p><label>
        <input type="checkbox" name="toppings[]" value="pepper"> Pepper
    </label></p>

    <p><label>
        <input type="checkbox" name="toppings[]" value="garlic"> Garlic salt
    </label></p>

    <!-- btn btn-primary：Bootstrap 的藍色主按鈕樣式 -->
    <p><input type="submit" class="btn btn-primary"></p>
</form>
</body>
</html>
