<!doctype html>
<html>
<head>
    <title>Single Selection list</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container">
<h1>Flower selection</h1>

<!--
  重點：可多選的下拉選單（multiple select）
  - name="flowers[]" 加上中括號 → 使用者可選多個，PHP 端會收到陣列
        $_GET['flowers'] 例如 ['poppy', 'tulip']
  - multiple 屬性 → 允許按住 Ctrl / Cmd 多選
  - size="3"      → 一次顯示 3 列，變成「清單方塊」而不是下拉式選單

  提示：action 目前指向 .html 檔，靜態 HTML 無法處理表單資料；
  實務上應改成 .php（例如 05_multiple_process.php）才能在伺服器端讀取 $_GET['flowers']。
-->
<form method="GET" action="05_multiple_process.html">
    <div class="row">   <!-- Bootstrap：建立一排（12 欄）的水平容器 -->

        <!-- col-lg-3 = 大螢幕佔 3 欄；text-end = 靠右；py-2 = 上下留白 -->
        <div class="col-lg-3 text-end py-2">
            <input type="submit" value="Select a flower" class="btn btn-primary">
        </div>

        <div class="col-lg-3 text-end py-2">
            <!-- custom-select：預留的 Bootstrap 樣式 class（Bootstrap 5 已改名 form-select） -->
            <select name="flowers[]"
                    class="custom-select"
                    size="3"
                    multiple>
                <!-- 每個 option 的 value 才是真正送出的值，標籤文字只是顯示用 -->
                <option value="poppy">Poppy</option>
                <option value="daisy">Daisy</option>
                <option value="tulip">Tulip</option>
            </select>
        </div>
    </div>
</form>
</body>
</html>
